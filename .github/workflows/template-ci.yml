name: Template CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full:
    uses: RuchirChawdhry/ci-workflows/.github/workflows/copier-ci.yml@main
  minimal:
    uses: RuchirChawdhry/ci-workflows/.github/workflows/copier-ci.yml@main
    with:
      copier-data: '{"enable_jobs": false}'
      artifact-suffix: '-minimal'
