name: Template CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full:
    uses: RuchirChawdhry/ci-workflows/.github/workflows/copier-ci.yml@main
    with:
      python-typecheck: true
      redis-integration: true
  minimal:
    uses: RuchirChawdhry/ci-workflows/.github/workflows/copier-ci.yml@main
    with:
      copier-data: '{"enable_jobs": false}'
      artifact-suffix: '-minimal'
      python-typecheck: true
  full-mcp:
    uses: RuchirChawdhry/ci-workflows/.github/workflows/copier-ci.yml@main
    with:
      copier-data: '{"enable_jobs": true, "enable_mcp": true}'
      artifact-suffix: '-full-mcp'
      python-typecheck: true
      redis-integration: true
  minimal-mcp:
    uses: RuchirChawdhry/ci-workflows/.github/workflows/copier-ci.yml@main
    with:
      copier-data: '{"enable_jobs": false, "enable_mcp": true}'
      artifact-suffix: '-minimal-mcp'
      python-typecheck: true
  minimal-ntfy:
    uses: RuchirChawdhry/ci-workflows/.github/workflows/copier-ci.yml@main
    with:
      copier-data: '{"enable_jobs": false, "enable_ntfy": true}'
      artifact-suffix: '-minimal-ntfy'
      python-typecheck: true
  all-features:
    uses: RuchirChawdhry/ci-workflows/.github/workflows/copier-ci.yml@main
    with:
      copier-data: '{"enable_jobs": true, "enable_mcp": true, "enable_ntfy": true}'
      artifact-suffix: '-all-features'
      python-typecheck: true
      redis-integration: true
